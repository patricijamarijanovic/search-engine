<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ABCD Search Engine</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    color: #333;
}

.container { 
    max-width: 1200px; 
    margin: 0 auto; 
    padding: 2rem; 
}

.header { 
    text-align: center; 
    margin-bottom: 3rem; 
}

.header h1 { 
    color: white; 
    font-size: 3rem; 
    font-weight: 700; 
    margin-bottom: 0.5rem; 
}

.header p { 
    color: rgba(255,255,255,0.9); 
    font-size: 1.2rem; 
}

.search-container {
    background: white; 
    border-radius: 15px; 
    padding: 2rem;
    box-shadow: 0 20px 40px rgba(0,0,0,0.1); 
    margin-bottom: 2rem;
    position: relative; 
    z-index: 1;
}

.search-form { 
    display: flex; 
    flex-direction: column; 
    gap: 1rem; 
}

.input-group { 
    display: flex; 
    gap: 1rem; 
    flex-wrap: wrap; 
    position: relative; 
}

.search-input, .num-results {
    padding: 1rem; 
    border: 2px solid #e0e0e0; 
    border-radius: 10px; 
    font-size: 1rem;
}

.search-input { 
    flex: 1; 
    min-width: 300px; 
}

.search-input:focus { 
    outline: none; 
    border-color: #667eea; 
}

.num-results { 
    width: 150px; 
}

.search-buttons { 
    display: flex; 
    gap: 1rem; 
    flex-wrap: wrap; 
    align-items: center;
}

.btn {
    padding: 1rem 2rem; 
    border: none; 
    border-radius: 10px; 
    font-size: 1rem;
    font-weight: 600; 
    cursor: pointer; 
    transition: all 0.3s ease;
}

.btn-primary { 
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); 
    color: white; 
}

.btn-secondary { 
    background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%); 
    color: white; 
}

.btn-toggle {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
    border: none;
    border-radius: 10px;
    padding: 1rem 2rem;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    margin-top: 0.5rem; 
    margin-right: 1rem; 
    transition: all 0.3s ease;
}

.btn-toggle:hover { opacity: 0.85; }

#improvedQuery {
    font-style: italic;
    color: #333;
    margin-left: 1rem;
    white-space: nowrap;
}

.results-container {
    background: white; 
    border-radius: 15px; 
    padding: 2rem;
    box-shadow: 0 20px 40px rgba(0,0,0,0.1); 
    display: none;
    position: relative;
    z-index: 1; 
}

.result-item {
    padding: 1.5rem; 
    margin-bottom: 1rem; 
    border: 1px solid #e0e0e0;
    border-radius: 10px; 
    transition: 0.3s ease;
}

.result-item:hover { 
    border-color: #667eea; 
    transform: translateY(-2px); 
}

.result-title { 
    font-size: 1.2rem; 
    font-weight: 600; 
    color: #333; 
    margin-bottom: 0.5rem; 
}

.result-id { 
    font-size: 0.8rem; 
    color: #999; 
    margin-bottom: 0.5rem; 
}

.result-content { 
    color: #666; 
    line-height: 1.6; 
    margin-bottom: 1rem; 
}

.loading { 
    text-align: center; 
    padding: 2rem; 
    color: #666; 
}

.error { 
    background: #fee; 
    color: #c33; 
    padding: 1rem; 
    border-radius: 10px; 
    margin: 1rem 0; 
}

#answerContainer {
    display: none; 
    margin-bottom: 1.5rem;
    background: #f0f4ff;
    border-left: 5px solid #667eea;
    border-radius: 10px;
    padding: 1rem 1.5rem;
    position: relative;
}

#answerHeader {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

#answerHeader h2 {
    margin: 0;
    font-size: 1.4rem;
    font-weight: 600;
    color: #333;
}

#closeAnswerBtn {
    background: transparent;
    border: none;
    font-size: 1.2rem;
    cursor: pointer;
    color: #667eea;
    font-weight: bold;
}

#answerContent {
    margin-top: 0.5rem;
    font-size: 1.15rem;
    line-height: 1.55;
    white-space: pre-wrap;
    color: #333;
}
</style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>🧠 Sapien</h1>
        <p>Search Engine (Generated by Sonnet-4)</p>
    </div>

    <div class="search-container">
        <form class="search-form" id="searchForm">
            <div class="input-group">
                <input type="text" class="search-input" id="queryInput" placeholder="Enter your search query..." required>
                <input type="number" class="num-results" id="numResultsInput" placeholder="Results" min="1" max="100" value="10">
            </div>
            <div class="search-buttons">
                <button type="submit" class="btn btn-primary" id="searchBtn">🔍 Search</button>
                <span id="improvedQuery"></span>
            </div>
        </form>
    </div>

    <div id="answerContainer">
        <div id="answerHeader">
            <h2>Answer</h2>
            <button id="closeAnswerBtn">✖</button>
        </div>
        <div id="answerContent"></div>
    </div>

    <div class="results-container" id="resultsContainer">
        <div class="results-header">
            <h2>Search Results</h2>
            <div class="results-count" id="resultsCount"></div>
        </div>
        <div id="resultsContent"></div>
    </div>
</div>

<script>
    const API_BASE_URL = 'http://127.0.0.1:8000/api/v1';
    const searchForm = document.getElementById('searchForm');
    const queryInput = document.getElementById('queryInput');
    const numResultsInput = document.getElementById('numResultsInput');
    const improvedQuerySpan = document.getElementById('improvedQuery');
    const resultsContainer = document.getElementById('resultsContainer');
    const resultsCount = document.getElementById('resultsCount');
    const resultsContent = document.getElementById('resultsContent');

    searchForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        await performSearch();
    });

    async function performSearch() {
        let query = queryInput.value.trim();
        const numResults = parseInt(numResultsInput.value) || 10;
        if (!query) return showError('Please enter a search query');
        showLoading();

        try {
            const response = await fetch(`${API_BASE_URL}/search?query=${encodeURIComponent(query)}&num_results=${numResults}`);
            if (!response.ok) throw new Error(`HTTP ${response.status}: ${response.statusText}`);
            const data = await response.json();

            // Show improved query
            if (data.improved_query && data.improved_query !== query) {
                improvedQuerySpan.innerHTML = `Você pensou: <span id="clickableQuery" style="text-decoration: underline; cursor: pointer; color: #667eea;">"${data.improved_query}"</span>`;
                const clickable = document.getElementById('clickableQuery');
                clickable.addEventListener('click', () => {
                    queryInput.value = data.improved_query;
                    improvedQuerySpan.textContent = ''; // hide after click
                    queryInput.focus();
                });
            } else {
                improvedQuerySpan.textContent = '';
            }

            // Display answer
            const answerContainer = document.getElementById('answerContainer');
            const answerContent = document.getElementById('answerContent');
            if (data.answer) {
                answerContent.textContent = data.answer;
                answerContainer.style.display = 'block';
            } else {
                answerContainer.style.display = 'none';
            }

            displayResults(data.results);
        } catch (err) { 
            showError(`Search failed: ${err.message}`); 
        }
    }

    document.getElementById('closeAnswerBtn').addEventListener('click', () => {
        document.getElementById('answerContainer').style.display = 'none';
    });

    async function performSimilarSearch(docId) {
        const numResults = parseInt(numResultsInput.value) || 10;
        showLoading();
        try {
            const response = await fetch(`${API_BASE_URL}/search_like?doc_id=${docId}&num_results=${numResults}`);
            if (!response.ok) throw new Error(`HTTP ${response.status}: ${response.statusText}`);
            const data = await response.json();
            displayResults(data.results);
        } catch (err) { showError(`Similarity search failed: ${err.message}`); }
    }

    function showLoading() {
        resultsContainer.style.display = 'block';
        resultsContent.innerHTML = '<div class="loading">Searching...</div>';
        resultsCount.textContent = '';
    }

    function displayResults(results) {
        resultsContainer.style.display = 'block';
        resultsCount.textContent = `Found ${results.length} results`;

        if (!results.length) {
            resultsContent.innerHTML = '<div class="no-results"><h3>No results found</h3></div>';
            return;
        }

        resultsContent.innerHTML = results.map(result => `
            <div class="result-item">
                <div class="result-title">${escapeHtml(result.title)}</div>
                <div class="result-id">ID: ${result.id}</div>
                <div class="result-content" id="content-${result.id}">
                    ${escapeHtml(result.content)}
                </div>
                <button class="btn btn-toggle" id="toggle-${result.id}">
                    Most Relevant Paragraph
                </button>
                <button class="btn btn-secondary search-similar-btn" data-id="${result.id}">
                    ✨ Search Similar
                </button>
            </div>
        `).join('');

        results.forEach(result => {
            const toggleBtn = document.getElementById(`toggle-${result.id}`);
            const contentDiv = document.getElementById(`content-${result.id}`);
            toggleBtn.addEventListener('click', () => {
                if (toggleBtn.textContent === "Show Whole") {
                    contentDiv.textContent = result.content;
                    toggleBtn.textContent = "Most Relevant Paragraph";
                } else {
                    contentDiv.textContent = result.best_snippet || result.content;
                    toggleBtn.textContent = "Show Whole";
                }
            });
        });

        document.querySelectorAll('.search-similar-btn').forEach(btn => {
            btn.addEventListener('click', async () => {
                const docId = parseInt(btn.dataset.id);
                await performSimilarSearch(docId);
            });
        });
    }

    function showError(msg) {
        resultsContainer.style.display = 'block';
        resultsContent.innerHTML = `<div class="error">${escapeHtml(msg)}</div>`;
        resultsCount.textContent = '';
    }

    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    document.addEventListener('DOMContentLoaded', () => queryInput.focus());
</script>
</body>
</html>
